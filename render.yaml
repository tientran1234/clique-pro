services:
  - type: web
    name: clique-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    startCommand: ./start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma.db
      - key: PORT
        value: 3000
