services:
  - type: web
    name: clique-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    startCommand: sh start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # ⚠️ WARNING: SQLite không lưu trữ được trên Render (ephemeral filesystem)
        # Data sẽ BỊ MẤT sau mỗi lần deploy hoặc restart
        # Để dùng production, nên chuyển sang PostgreSQL
        value: file:./prisma.db
      - key: ALLOWED_ORIGINS
        value: https://clique-fe.vercel.app,http://localhost:5173
