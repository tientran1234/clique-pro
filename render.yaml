services:
  - type: web
    name: clique-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    startCommand: sh start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clique-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://clique-fe.vercel.app,http://localhost:5173

databases:
  - name: clique-db
    databaseName: clique_dating
    plan: free
    region: singapore
